[package]
edition.workspace = true
license.workspace = true
name = "codex-toolbox"
version.workspace = true

[lib]
name = "codex_toolbox"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
clap = { workspace = true, features = ["derive"] }
codex-byteask-policy = { workspace = true }
codex-check-result = { workspace = true }
codex-context-tools = { workspace = true }
codex-core = { workspace = true }
codex-cpp-tools = { workspace = true }
codex-extension-api = { workspace = true }
codex-login = { workspace = true }
codex-merge-check = { workspace = true }
codex-protocol = { workspace = true }
codex-ref-tools = { workspace = true }
codex-results-store = { workspace = true }
codex-utils-cli = { workspace = true }
codex-utils-home-dir = { workspace = true }
codex-utils-output-truncation = { workspace = true }
rmcp = { workspace = true, default-features = false, features = ["server"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
toml_edit = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
rmcp = { workspace = true, default-features = false, features = ["client", "server"] }
tempfile = { workspace = true }
toml = { workspace = true }
