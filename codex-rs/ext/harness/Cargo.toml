[package]
edition.workspace = true
license.workspace = true
name = "codex-byteask-harness"
version.workspace = true

[lib]
name = "codex_byteask_harness"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
codex-core = { workspace = true }
