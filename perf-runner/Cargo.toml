[package]
name = "perf-runner"
version = "0.1.0"
edition = "2024"
publish = false
description = "ByteAsk perf lab runner: preflight, isolated interleaved A/B measurement, TMA"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[profile.release]
opt-level = 3
debug = 0

# Standalone: not a member of the engine's codex-rs workspace.
[workspace]
