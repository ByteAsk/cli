name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Secrets, repository rules and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan the change for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          curl -fsSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o gl.sums "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sum=$(grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" gl.sums | cut -d' ' -f1)
          echo "${sum}  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          range="HEAD~1..HEAD"
          case "$BASE" in ""|0000000000000000000000000000000000000000) ;; *) range="$BASE..HEAD";; esac
          ./gitleaks git --redact --no-banner --log-opts="$range" .
      - name: Check repository rules
        run: python3 scripts/check_repo_rules.py --base "${{ github.event.pull_request.base.sha || github.event.before }}"
      - name: Launcher syntax
        run: |
          for f in byteask install.sh; do sh -n "$f"; done
          python3 -m py_compile helpers/*.py

  engine:
    name: Engine (format and compile check)
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        working-directory: codex-rs
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        working-directory: codex-rs
        run: cargo fmt --all -- --check
      - name: Fetch prebuilt V8
        run: python3 scripts/fetch_rusty_v8.py --target x86_64-unknown-linux-gnu --github-env
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
      - name: Compile check
        working-directory: codex-rs
        run: cargo check -p codex-cli --locked
